name: Collaborate *
description: 'Collaborate.com was a mobile-first team collaboration service — unified
  document sharing, task management and team messaging across iPhone, iPod Touch,
  Android and the web, with integrations into Box, Dropbox and Google Drive. It was
  a service of Boston-based Kibits Corp, founded in 2011 by Matt Cutler (CEO) and
  David Greenstein (CTO), and was backed by GV (Google Ventures), Charles River
  Ventures, General Catalyst, SOS Ventures, Commonwealth Capital Ventures and Launch
  Capital. The company exited via acquisition by Cisco (December 2013), and its
  collaboration technology was folded into Cisco''s communications portfolio. The
  company no longer operates independently: collaborate.com is now a MarkMonitor-managed
  redirect that sends plain-HTTP traffic to https://www.webex.com/ and serves nothing
  over HTTPS. There is no developer portal, documentation, SDK, package, webhook or
  API surface to catalog — the asterisk in GV''s portfolio listing marks the exit.'
